services:
  - type: web
    name: swaphub-api-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # User enters this on Render dashboard
      - key: JWT_SECRET
        sync: false # User enters this on Render dashboard
